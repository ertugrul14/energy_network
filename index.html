<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>3D Architectural Diorama</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1419;
      touch-action: none;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
  import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f1419);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(65, 55, 85);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = true;
  controls.minDistance = 30;
  controls.maxDistance = 180;
  controls.target.set(0, 6, 0);
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

  const ambient = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(35, 50, 20);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.near = 1;
  dirLight.shadow.camera.far = 150;
  dirLight.shadow.camera.left = -60;
  dirLight.shadow.camera.right = 60;
  dirLight.shadow.camera.top = 60;
  dirLight.shadow.camera.bottom = -60;
  scene.add(dirLight);

  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x2a2f36,
    roughness: 0.9,
    metalness: 0.1
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(180, 120), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const makeBox = (w, h, d, color) => {
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.1 });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  };

  const makeCylinder = (rTop, rBot, h, color, radialSeg = 16) => {
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.1 });
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, radialSeg), mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  };

  const createResidential = () => {
    const g = new THREE.Group();
    const houseColors = [0xa3c1ff, 0xffc4a3, 0xb2f2bb];
    const roofColors = [0x44546a, 0x6a4444, 0x446a54];
    const positions = [
      [-4, 0, -2],
      [4, 0, 2],
      [0, 0, 6]
    ];
    positions.forEach((p, i) => {
      const base = makeBox(4, 2.5, 4, houseColors[i]);
      base.position.set(p[0], 1.25, p[2]);
      const roof = makeCylinder(0, 3.2, 2.5, roofColors[i], 4);
      roof.position.set(p[0], 3.1, p[2]);
      roof.rotation.y = Math.PI / 4;
      g.add(base, roof);
    });
    return g;
  };

  const createHospital = () => {
    const g = new THREE.Group();
    const base = makeBox(10, 5, 6, 0xf2f2f2);
    base.position.y = 2.5;
    g.add(base);

    const top = makeBox(6, 2.5, 4, 0xe6e6e6);
    top.position.set(0, 5.2, 0);
    g.add(top);

    const crossMat = new THREE.MeshStandardMaterial({ color: 0xd94a4a, roughness: 0.4 });
    const bar1 = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.4, 0.4), crossMat);
    const bar2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.6, 0.4), crossMat);
    bar1.position.set(0, 5.3, 3.1);
    bar2.position.set(0, 5.3, 3.1);
    bar1.castShadow = bar2.castShadow = true;
    g.add(bar1, bar2);

    return g;
  };

  const createSchool = () => {
    const g = new THREE.Group();
    const main = makeBox(10, 4, 6, 0xffe7b3);
    main.position.y = 2;
    g.add(main);

    const wingL = makeBox(5, 3, 6, 0xf7d891);
    wingL.position.set(-7.5, 1.5, 0);
    g.add(wingL);

    const wingR = makeBox(5, 3, 6, 0xf7d891);
    wingR.position.set(7.5, 1.5, 0);
    g.add(wingR);

    const tower = makeBox(3, 6, 3, 0xffe0a8);
    tower.position.set(0, 6, 0);
    g.add(tower);

    const clock = new THREE.Mesh(
      new THREE.CircleGeometry(0.8, 16),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
    );
    clock.position.set(0, 6.5, 1.6);
    clock.castShadow = true;
    g.add(clock);

    return g;
  };

  const createStadium = () => {
    const g = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xa9b2bf, roughness: 0.6, side: THREE.DoubleSide });
    const outerWall = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 2.5, 32, 1, true), wallMat);
    outerWall.position.y = 1.25;
    outerWall.castShadow = outerWall.receiveShadow = true;
    g.add(outerWall);

    const innerWall = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 4.5, 2.2, 32, 1, true), wallMat);
    innerWall.position.y = 1.1;
    innerWall.castShadow = innerWall.receiveShadow = true;
    g.add(innerWall);

    const field = new THREE.Mesh(
      new THREE.CylinderGeometry(4.2, 4.2, 0.2, 32),
      new THREE.MeshStandardMaterial({ color: 0x2b7a4b, roughness: 0.8 })
    );
    field.position.y = 0.1;
    field.receiveShadow = true;
    g.add(field);

    return g;
  };

  const createAirport = () => {
    const g = new THREE.Group();
    const terminal = makeBox(16, 2.5, 6, 0xd6dbe1);
    terminal.position.y = 1.25;
    g.add(terminal);

    const tower = makeCylinder(1.2, 1.6, 8, 0xbac3cf);
    tower.position.set(8.5, 4, -2);
    g.add(tower);

    const cab = makeBox(3, 1.5, 3, 0xcde7ff);
    cab.position.set(8.5, 8.2, -2);
    g.add(cab);

    return g;
  };

  const createPort = () => {
    const g = new THREE.Group();
    const dock = makeBox(18, 1, 8, 0x7a6b5d);
    dock.position.y = 0.5;
    g.add(dock);

    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 8),
      new THREE.MeshStandardMaterial({ color: 0x1e6aa8, roughness: 0.7, metalness: 0.2 })
    );
    water.rotation.x = -Math.PI / 2;
    water.position.set(0, 0.02, -6);
    water.receiveShadow = true;
    g.add(water);

    const containerColors = [0xf26d6d, 0xf2d16d, 0x6df2b7, 0x6da1f2];
    for (let i = 0; i < 4; i++) {
      const c = makeBox(3.2, 1.4, 1.6, containerColors[i]);
      c.position.set(-6 + i * 3.5, 1.2 + (i % 2) * 1.6, 1.5);
      g.add(c);
    }

    const craneMast = makeBox(0.6, 6, 0.6, 0x6b7c8a);
    craneMast.position.set(6.5, 3, 2);
    g.add(craneMast);

    const craneArm = makeBox(6, 0.4, 0.4, 0x6b7c8a);
    craneArm.position.set(9.5, 5.5, 2);
    g.add(craneArm);

    const hook = makeBox(0.3, 1.2, 0.3, 0x3e4a55);
    hook.position.set(12, 4.8, 2);
    g.add(hook);

    return g;
  };

  const createFactory = () => {
    const g = new THREE.Group();
    const base = makeBox(12, 3, 8, 0xb68c6b);
    base.position.y = 1.5;
    g.add(base);

    const sawToothShape = new THREE.Shape();
    sawToothShape.moveTo(0, 0);
    sawToothShape.lineTo(2.2, 0);
    sawToothShape.lineTo(1.6, 1.2);
    sawToothShape.lineTo(0, 1.2);
    const roofGeom = new THREE.ExtrudeGeometry(sawToothShape, { depth: 8, bevelEnabled: false });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x9c7760, roughness: 0.8 });
    for (let i = 0; i < 4; i++) {
      const roof = new THREE.Mesh(roofGeom, roofMat);
      roof.position.set(-5 + i * 2.5, 3, -4);
      roof.rotation.y = Math.PI / 2;
      roof.castShadow = roof.receiveShadow = true;
      g.add(roof);
    }

    const stack1 = makeCylinder(0.7, 0.9, 6, 0x6b6f7a);
    stack1.position.set(-4.5, 6, 2.5);
    g.add(stack1);

    const stack2 = makeCylinder(0.7, 0.9, 5.5, 0x6b6f7a);
    stack2.position.set(-2.5, 5.5, 2.5);
    g.add(stack2);

    return g;
  };

  const createOfficeTower = () => {
    const g = new THREE.Group();
    const tower = makeBox(6, 18, 6, 0x5aa8ff);
    tower.position.y = 9;
    g.add(tower);

    const stripeMat = new THREE.MeshStandardMaterial({ color: 0x84c6ff, roughness: 0.4, metalness: 0.2 });
    for (let i = -2; i <= 2; i++) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.2, 17, 6.2), stripeMat);
      stripe.position.set(i * 1.1, 9, 0);
      stripe.castShadow = true;
      g.add(stripe);
    }

    return g;
  };

  const buildings = [
    { create: createResidential },
    { create: createHospital },
    { create: createSchool },
    { create: createStadium },
    { create: createAirport },
    { create: createPort },
    { create: createFactory },
    { create: createOfficeTower }
  ];

  const gridCols = 4;
  const spacing = 28;
  const startX = -spacing * (gridCols - 1) * 0.5;
  const startZ = 18;

  buildings.forEach((b, i) => {
    const row = Math.floor(i / gridCols);
    const col = i % gridCols;
    const group = b.create();
    group.position.set(startX + col * spacing, 0, startZ - row * spacing);
    scene.add(group);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
