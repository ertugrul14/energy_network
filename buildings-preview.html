<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Building Diorama</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #labels { position: fixed; bottom: 0; left: 0; right: 0; display: flex; flex-wrap: wrap;
    justify-content: center; gap: 6px; padding: 10px; pointer-events: none; z-index: 10; }
  .label { font: 600 11px/1 system-ui, sans-serif; color: #b0c4de; background: rgba(10,10,18,0.85);
    border: 1px solid rgba(88,166,255,0.2); padding: 5px 10px; border-radius: 4px;
    letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>
<div id="labels">
  <span class="label">Residential</span>
  <span class="label">Hospital</span>
  <span class="label">School</span>
  <span class="label">Stadium</span>
  <span class="label">Airport</span>
  <span class="label">Port</span>
  <span class="label">Factory</span>
  <span class="label">Office Tower</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.FogExp2(0x0d1117, 0.006);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(55, 45, 55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 20;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI / 2.15;
controls.update();

// ─── Lights ───
const ambient = new THREE.AmbientLight(0x4466aa, 0.6);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffeedd, 1.8);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.001;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-20, 20, -15);
scene.add(fill);

const hemi = new THREE.HemisphereLight(0x334466, 0x111118, 0.5);
scene.add(hemi);

// ─── Ground ───
const groundGeo = new THREE.PlaneGeometry(160, 160);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x151922, roughness: 0.95 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid lines
const gridHelper = new THREE.GridHelper(160, 40, 0x1a2030, 0x141a24);
scene.add(gridHelper);

// ─── Material helpers ───
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.7, metalness: opts.metal ?? 0.1, ...opts
  });
}

function mesh(geo, material, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, shadow = true } = {}) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  if (rx) m.rotation.x = rx;
  if (ry) m.rotation.y = ry;
  if (rz) m.rotation.z = rz;
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  return m;
}

// ─── Grid positions (2 rows × 4 cols) ───
const positions = [
  { x: -28, z: -18 }, { x: -9, z: -18 }, { x: 10, z: -18 }, { x: 30, z: -18 },
  { x: -28, z: 14 },  { x: -9, z: 14 },  { x: 10, z: 14 },  { x: 30, z: 14 },
];

// ════════════════════════════════════════
// 1. RESIDENTIAL BUILDINGS
// ════════════════════════════════════════
function createResidential() {
  const g = new THREE.Group();
  const wallMat = mat(0xc8b89a);
  const roofMat = mat(0x8b3a3a, { rough: 0.8 });
  const wallMat2 = mat(0xb8a888);
  const roofMat2 = mat(0x5a4a3a, { rough: 0.85 });
  const doorMat = mat(0x4a3520);
  const winMat = mat(0x88bbee, { rough: 0.3, metal: 0.2 });

  function house(w, h, d, roofH, wallM, roofM, px, pz) {
    const grp = new THREE.Group();
    grp.add(mesh(new THREE.BoxGeometry(w, h, d), wallM, { y: h / 2 }));
    const roofShape = new THREE.Shape();
    roofShape.moveTo(-w / 2 - 0.3, 0);
    roofShape.lineTo(0, roofH);
    roofShape.lineTo(w / 2 + 0.3, 0);
    roofShape.lineTo(-w / 2 - 0.3, 0);
    const roofGeo = new THREE.ExtrudeGeometry(roofShape, { depth: d + 0.6, bevelEnabled: false });
    roofGeo.translate(0, 0, -(d + 0.6) / 2);
    grp.add(mesh(roofGeo, roofM, { y: h }));

    grp.add(mesh(new THREE.BoxGeometry(0.8, 1.4, 0.1), doorMat, { y: 0.7, z: d / 2 + 0.05 }));
    grp.add(mesh(new THREE.BoxGeometry(0.7, 0.7, 0.1), winMat, { x: -1.2, y: h * 0.6, z: d / 2 + 0.05 }));
    grp.add(mesh(new THREE.BoxGeometry(0.7, 0.7, 0.1), winMat, { x: 1.2, y: h * 0.6, z: d / 2 + 0.05 }));

    grp.position.set(px, 0, pz);
    return grp;
  }

  g.add(house(4, 3.2, 3.5, 2.2, wallMat, roofMat, -2.5, -1));
  g.add(house(3.5, 3.8, 3, 2.5, wallMat2, roofMat2, 2.5, 0.5));
  g.add(house(3, 2.8, 2.8, 1.8, wallMat, roofMat2, 0, 3.5));

  return g;
}

// ════════════════════════════════════════
// 2. HOSPITAL
// ════════════════════════════════════════
function createHospital() {
  const g = new THREE.Group();
  const wallMat = mat(0xe8e8e8, { rough: 0.5 });
  const crossMat = mat(0xdd2222, { rough: 0.4, emissive: 0xaa0000, emissiveIntensity: 0.3 });
  const winMat = mat(0x88bbdd, { rough: 0.3 });
  const accentMat = mat(0xaabbcc);

  g.add(mesh(new THREE.BoxGeometry(8, 5, 6), wallMat, { y: 2.5 }));
  g.add(mesh(new THREE.BoxGeometry(3, 5, 3), wallMat, { x: 0, y: 2.5, z: -4.5 }));
  g.add(mesh(new THREE.BoxGeometry(8.2, 0.3, 6.2), accentMat, { y: 5.15 }));

  // Red cross on front
  g.add(mesh(new THREE.BoxGeometry(2.0, 0.5, 0.15), crossMat, { y: 4, z: 3.08 }));
  g.add(mesh(new THREE.BoxGeometry(0.5, 2.0, 0.15), crossMat, { y: 4, z: 3.08 }));

  // Windows grid
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 4; col++) {
      g.add(mesh(new THREE.BoxGeometry(0.6, 0.9, 0.1), winMat,
        { x: -2.5 + col * 1.6, y: 1.5 + row * 2.0, z: 3.05 }));
    }
  }

  g.add(mesh(new THREE.BoxGeometry(1.2, 1.8, 0.1), mat(0x446688, { rough: 0.3 }), { y: 0.9, z: 3.05 }));

  return g;
}

// ════════════════════════════════════════
// 3. SCHOOL
// ════════════════════════════════════════
function createSchool() {
  const g = new THREE.Group();
  const brickMat = mat(0xb07050, { rough: 0.8 });
  const roofMat = mat(0x555555, { rough: 0.6 });
  const winMat = mat(0x88bbee, { rough: 0.3 });
  const towerMat = mat(0xc09070, { rough: 0.75 });

  // Main wing
  g.add(mesh(new THREE.BoxGeometry(10, 3.5, 4), brickMat, { y: 1.75 }));
  g.add(mesh(new THREE.BoxGeometry(10.2, 0.4, 4.3), roofMat, { y: 3.7 }));

  // Left wing
  g.add(mesh(new THREE.BoxGeometry(4, 3.5, 3), brickMat, { x: -3, y: 1.75, z: -3.5 }));
  g.add(mesh(new THREE.BoxGeometry(4.2, 0.4, 3.3), roofMat, { x: -3, y: 3.7, z: -3.5 }));

  // Right wing
  g.add(mesh(new THREE.BoxGeometry(4, 3.5, 3), brickMat, { x: 3, y: 1.75, z: -3.5 }));
  g.add(mesh(new THREE.BoxGeometry(4.2, 0.4, 3.3), roofMat, { x: 3, y: 3.7, z: -3.5 }));

  // Central clock tower
  g.add(mesh(new THREE.BoxGeometry(1.8, 3, 1.8), towerMat, { y: 5.4 }));
  g.add(mesh(new THREE.ConeGeometry(1.6, 2, 4), roofMat, { y: 7.9 }));

  // Clock face
  g.add(mesh(new THREE.CircleGeometry(0.5, 16), mat(0xeeeedd), { y: 5.8, z: 0.92 }));
  g.add(mesh(new THREE.BoxGeometry(0.05, 0.35, 0.05), mat(0x222222), { y: 5.9, z: 0.95 }));
  g.add(mesh(new THREE.BoxGeometry(0.05, 0.25, 0.05), mat(0x222222),
    { y: 5.85, z: 0.95, rz: -Math.PI / 4 }));

  // Windows on main wing front
  for (let i = 0; i < 5; i++) {
    g.add(mesh(new THREE.BoxGeometry(0.6, 0.9, 0.1), winMat,
      { x: -3.6 + i * 1.8, y: 2.2, z: 2.05 }));
  }

  // Entry door
  g.add(mesh(new THREE.BoxGeometry(1.2, 2, 0.1), mat(0x4a3520), { y: 1, z: 2.05 }));

  return g;
}

// ════════════════════════════════════════
// 4. STADIUM
// ════════════════════════════════════════
function createStadium() {
  const g = new THREE.Group();
  const concMat = mat(0x888888, { rough: 0.8 });
  const seatMat = mat(0x5566aa, { rough: 0.6 });
  const fieldMat = mat(0x2d6b2d, { rough: 0.9 });
  const lineMat = mat(0xdddddd);

  // Outer bowl — torus-like ring using lathe
  const outerPts = [
    new THREE.Vector2(4, 0),
    new THREE.Vector2(6.5, 0),
    new THREE.Vector2(7, 2.4),
    new THREE.Vector2(6.2, 3.3),
    new THREE.Vector2(5.5, 3.3),
    new THREE.Vector2(5, 2.4),
    new THREE.Vector2(4, 0.6),
  ];
  const bowlGeo = new THREE.LatheGeometry(outerPts, 32);
  g.add(mesh(bowlGeo, concMat, { y: 0 }));

  // Seats inside (colored ring)
  const seatPts = [
    new THREE.Vector2(4.05, 0.2),
    new THREE.Vector2(4.8, 0.6),
    new THREE.Vector2(5.2, 2.5),
    new THREE.Vector2(4.9, 2.5),
    new THREE.Vector2(4.5, 0.6),
    new THREE.Vector2(4.05, 0.35),
  ];
  const seatGeo = new THREE.LatheGeometry(seatPts, 32);
  g.add(mesh(seatGeo, seatMat, { y: 0 }));

  // Field
  const fieldGeo = new THREE.CircleGeometry(3.8, 32);
  g.add(mesh(fieldGeo, fieldMat, { y: 0.15, rx: -Math.PI / 2 }));

  // Center circle
  const ringGeo = new THREE.RingGeometry(0.8, 0.85, 24);
  g.add(mesh(ringGeo, lineMat, { y: 0.18, rx: -Math.PI / 2 }));

  // Half-way line
  g.add(mesh(new THREE.BoxGeometry(7.4, 0.02, 0.06), lineMat, { y: 0.18 }));

  // Floodlight towers
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const px = Math.cos(angle) * 7;
    const pz = Math.sin(angle) * 7;
    g.add(mesh(new THREE.CylinderGeometry(0.1, 0.15, 6, 6), concMat, { x: px, y: 3, z: pz }));
    g.add(mesh(new THREE.BoxGeometry(0.8, 0.3, 0.8), mat(0xffee88, {
      emissive: 0xffdd44, emissiveIntensity: 0.5
    }), { x: px, y: 6.15, z: pz }));
  }

  return g;
}

// ════════════════════════════════════════
// 5. AIRPORT
// ════════════════════════════════════════
function createAirport() {
  const g = new THREE.Group();
  const termMat = mat(0xbbccdd, { rough: 0.4, metal: 0.15 });
  const glassMat = mat(0x6699bb, { rough: 0.2, metal: 0.3 });
  const towerMat = mat(0x99aabb, { rough: 0.4 });
  const runwayMat = mat(0x333338, { rough: 0.95 });
  const planeMat = mat(0xe0e0e0, { rough: 0.5 });

  // Terminal
  g.add(mesh(new THREE.BoxGeometry(12, 2.5, 4), termMat, { y: 1.25 }));
  g.add(mesh(new THREE.BoxGeometry(12.2, 0.3, 4.2), mat(0x778899), { y: 2.65 }));

  // Terminal glass front
  g.add(mesh(new THREE.BoxGeometry(11.5, 1.5, 0.1), glassMat, { y: 1.5, z: 2.05 }));

  // Gate extensions
  for (let i = 0; i < 3; i++) {
    g.add(mesh(new THREE.BoxGeometry(1.2, 1.5, 2), termMat,
      { x: -4 + i * 4, y: 0.75, z: -3 }));
  }

  // Control tower
  g.add(mesh(new THREE.CylinderGeometry(0.5, 0.6, 7, 8), towerMat, { x: 7, y: 3.5 }));
  g.add(mesh(new THREE.CylinderGeometry(1.4, 1.2, 1.5, 8), glassMat, { x: 7, y: 7.3 }));
  g.add(mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.2, 8), towerMat, { x: 7, y: 8.1 }));

  // Runway
  g.add(mesh(new THREE.BoxGeometry(16, 0.05, 2.5), runwayMat, { x: -1, y: 0.03, z: -6 }));

  // Runway markings
  for (let i = 0; i < 8; i++) {
    g.add(mesh(new THREE.BoxGeometry(0.8, 0.02, 0.12), mat(0xdddddd),
      { x: -7 + i * 2, y: 0.07, z: -6 }));
  }

  // Plane on runway
  const plane = new THREE.Group();
  plane.add(mesh(new THREE.CylinderGeometry(0.35, 0.3, 3, 8), planeMat, { y: 0.5, rz: Math.PI / 2 }));
  // Wings
  plane.add(mesh(new THREE.BoxGeometry(0.8, 0.06, 3.5), planeMat, { y: 0.5 }));
  // Tail
  plane.add(mesh(new THREE.BoxGeometry(0.5, 0.06, 1.2), planeMat, { x: -1.3, y: 0.5 }));
  plane.add(mesh(new THREE.BoxGeometry(0.06, 0.8, 0.5), planeMat, { x: -1.3, y: 0.9 }));
  // Engines
  plane.add(mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.5, 8), mat(0x666666),
    { y: 0.4, z: 1, rz: Math.PI / 2 }));
  plane.add(mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.5, 8), mat(0x666666),
    { y: 0.4, z: -1, rz: Math.PI / 2 }));
  plane.position.set(-4, 0, -6);
  plane.rotation.y = -0.1;
  g.add(plane);

  return g;
}

// ════════════════════════════════════════
// 6. PORT
// ════════════════════════════════════════
function createPort() {
  const g = new THREE.Group();
  const dockMat = mat(0x888078, { rough: 0.9 });
  const waterMat = mat(0x224488, { rough: 0.3, metal: 0.05 });
  const craneMat = mat(0xdd8822, { rough: 0.5, metal: 0.3 });
  const containerColors = [0xdd3333, 0x2266bb, 0x33aa44, 0xddaa22, 0x885599];

  // Dock platform
  g.add(mesh(new THREE.BoxGeometry(12, 0.6, 7), dockMat, { y: 0.3, z: 1 }));

  // Water area
  g.add(mesh(new THREE.BoxGeometry(12, 0.1, 5), waterMat, { y: 0.05, z: -5.5 }));
  // Water surface detail
  g.add(mesh(new THREE.PlaneGeometry(12, 5), mat(0x3366aa, { rough: 0.2, transparent: true, opacity: 0.4 }),
    { y: 0.12, z: -5.5, rx: -Math.PI / 2, shadow: false }));

  // Containers — stacks
  function container(cx, cy, cz, color) {
    g.add(mesh(new THREE.BoxGeometry(2.2, 1.1, 1.1), mat(color, { rough: 0.6 }),
      { x: cx, y: cy, z: cz }));
  }

  container(-3, 1.15, 0, containerColors[0]);
  container(-3, 2.25, 0, containerColors[1]);
  container(-0.5, 1.15, 0, containerColors[2]);
  container(-0.5, 1.15, 1.3, containerColors[3]);
  container(2.5, 1.15, 0, containerColors[4]);
  container(2.5, 2.25, 0, containerColors[0]);
  container(2.5, 1.15, 1.3, containerColors[1]);

  // Crane 1
  function crane(cx, cz) {
    const cg = new THREE.Group();
    // Vertical mast
    cg.add(mesh(new THREE.BoxGeometry(0.3, 8, 0.3), craneMat, { y: 4 }));
    // Horizontal boom
    cg.add(mesh(new THREE.BoxGeometry(6, 0.25, 0.3), craneMat, { y: 7.8, x: 1 }));
    // Support cable
    cg.add(mesh(new THREE.CylinderGeometry(0.03, 0.03, 5, 4), craneMat, { x: 3, y: 5.3 }));
    // Counter-weight
    cg.add(mesh(new THREE.BoxGeometry(0.8, 0.6, 0.6), mat(0x555555), { x: -2, y: 7.5 }));
    cg.position.set(cx, 0.6, cz);
    return cg;
  }

  g.add(crane(-4.5, -2));
  g.add(crane(3, -2));

  return g;
}

// ════════════════════════════════════════
// 7. FACTORY
// ════════════════════════════════════════
function createFactory() {
  const g = new THREE.Group();
  const wallMat = mat(0x777777, { rough: 0.8 });
  const roofMat = mat(0x555555, { rough: 0.7, metal: 0.15 });
  const chimMat = mat(0x664444, { rough: 0.7 });
  const smokeMat = mat(0x999999, { rough: 0.9, transparent: true, opacity: 0.3 });
  const doorMat = mat(0x556677, { rough: 0.5 });

  // Main building body
  g.add(mesh(new THREE.BoxGeometry(10, 3, 6), wallMat, { y: 1.5 }));

  // Sawtooth roof — 4 teeth
  for (let i = 0; i < 4; i++) {
    const toothShape = new THREE.Shape();
    toothShape.moveTo(0, 0);
    toothShape.lineTo(2.5, 2);
    toothShape.lineTo(2.5, 0);
    toothShape.lineTo(0, 0);
    const toothGeo = new THREE.ExtrudeGeometry(toothShape, { depth: 5.8, bevelEnabled: false });
    toothGeo.translate(0, 0, -2.9);
    const tooth = mesh(toothGeo, roofMat, { x: -5 + i * 2.5, y: 3 });
    g.add(tooth);
  }

  // Smokestack 1
  g.add(mesh(new THREE.CylinderGeometry(0.4, 0.5, 5, 8), chimMat, { x: -3.5, y: 4, z: -1.5 }));
  g.add(mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.2, 8), chimMat, { x: -3.5, y: 6.5, z: -1.5 }));
  // Smoke puff
  g.add(mesh(new THREE.SphereGeometry(0.5, 8, 6), smokeMat, { x: -3.5, y: 7.2, z: -1.5, shadow: false }));
  g.add(mesh(new THREE.SphereGeometry(0.35, 8, 6), smokeMat, { x: -3.3, y: 7.8, z: -1.3, shadow: false }));

  // Smokestack 2
  g.add(mesh(new THREE.CylinderGeometry(0.35, 0.45, 4, 8), chimMat, { x: -1.5, y: 3.5, z: -1.5 }));
  g.add(mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.2, 8), chimMat, { x: -1.5, y: 5.5, z: -1.5 }));
  g.add(mesh(new THREE.SphereGeometry(0.4, 8, 6), smokeMat, { x: -1.5, y: 6.1, z: -1.5, shadow: false }));

  // Loading bay doors
  for (let i = 0; i < 2; i++) {
    g.add(mesh(new THREE.BoxGeometry(2, 2.2, 0.1), doorMat,
      { x: -2 + i * 4, y: 1.1, z: 3.05 }));
  }

  return g;
}

// ════════════════════════════════════════
// 8. OFFICE TOWER
// ════════════════════════════════════════
function createOfficeTower() {
  const g = new THREE.Group();
  const glassMat = mat(0x5588bb, { rough: 0.15, metal: 0.4 });
  const frameMat = mat(0x334455, { rough: 0.5, metal: 0.3 });
  const lobbyMat = mat(0x556688, { rough: 0.4, metal: 0.2 });
  const antMat = mat(0x888888, { rough: 0.4, metal: 0.5 });

  // Main tower
  g.add(mesh(new THREE.BoxGeometry(4, 14, 3.5), glassMat, { y: 7 }));

  // Floor lines (horizontal frame strips)
  for (let i = 0; i < 7; i++) {
    g.add(mesh(new THREE.BoxGeometry(4.1, 0.08, 3.6), frameMat, { y: 2 + i * 2 }));
  }

  // Vertical frame strips (edges)
  for (let sx of [-1, 1]) {
    g.add(mesh(new THREE.BoxGeometry(0.08, 14, 3.6), frameMat, { x: sx * 2.02, y: 7 }));
  }

  // Lobby/base
  g.add(mesh(new THREE.BoxGeometry(5, 2, 4.5), lobbyMat, { y: 1 }));

  // Lobby entrance
  g.add(mesh(new THREE.BoxGeometry(1.6, 1.6, 0.1), mat(0x88aacc, { rough: 0.2 }),
    { y: 0.8, z: 2.3 }));

  // Crown/top
  g.add(mesh(new THREE.BoxGeometry(4.2, 0.5, 3.7), frameMat, { y: 14.25 }));

  // Antenna mast
  g.add(mesh(new THREE.CylinderGeometry(0.06, 0.08, 3, 6), antMat, { y: 16 }));
  // Blinking light
  g.add(mesh(new THREE.SphereGeometry(0.12, 8, 6), mat(0xff2222, {
    emissive: 0xff0000, emissiveIntensity: 0.8
  }), { y: 17.5, shadow: false }));

  return g;
}

// ─── Place all buildings ───
const builders = [
  createResidential, createHospital, createSchool, createStadium,
  createAirport, createPort, createFactory, createOfficeTower,
];

builders.forEach((fn, i) => {
  const building = fn();
  building.position.set(positions[i].x, 0, positions[i].z);
  scene.add(building);
});

// ─── Animate ───
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
